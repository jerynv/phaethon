[package]
name = "phaethon"
version = "0.1.0"
description = "Phaethon: an accessible, desktop-first life OS"
authors = ["Jeryn Vicari"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "phaethon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt", "signal", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "0.22"
# Course site addresses (already in the tree through Tauri and reqwest).
url = "2"
# Inflate for reading .docx attachments; already in the tree through Tauri.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# The save dialog for Export, driven from Rust only: the webview never picks a path.
tauri-plugin-dialog = "2"
# Export writes a space as one .zip.
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Text copies of course PDFs (MIT), read in a child process (lms/text.rs).
lopdf = { version = "0.45", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Text recognition for handwritten and scanned pages (lms/ocr.rs): Apple's own
# Vision, PDF rendering and image reading, on the device. The objc2 crates are
# Zlib OR Apache-2.0 OR MIT and already in the tree through Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGImage", "CGPDFDocument", "CGPDFPage"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-graphics"] }

# Text recognition on Windows (lms/text/ocr/winocr.rs): Windows' own PDF
# drawing and recogniser. MIT OR Apache-2.0, already in the tree through Tauri.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Pdf", "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_System_WinRT"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util"] }
