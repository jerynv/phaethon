# Packaging for Phaethon's desktop app. `pnpm dist` builds for this machine;
# .github/workflows/release.yml builds every platform and uploads to a draft
# GitHub release, which is what the in-app updater reads once it's published.
appId: io.github.jerynv.phaethon
productName: Phaethon
copyright: Copyright © 2026 Jeryn Vicari
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/web/**/*
  - dist/server/**/*
  - dist/desktop/**/*
  - "!dist/**/*.map"
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  # Renderer-only packages live in devDependencies so Vite bundles them into
  # dist/web without shipping them (or their transitive trees) in app.asar.
  # Strip source maps, type declarations, and unused runtime subtrees from the
  # few Node runtime dependencies that stay in dependencies.
  - "!**/node_modules/**/*.map"
  - "!**/node_modules/**/*.d.{ts,mts,cts}"
  - "!**/node_modules/pdfjs-dist/{build,web,types}/**"
  - "!**/node_modules/@tesseract.js-data/eng/4.0.0/**"
  - "!**/node_modules/tesseract.js-core/*.wasm.js"
  - "!**/node_modules/tesseract.js-core/tesseract-core.{js,wasm}"
  - "!**/node_modules/tesseract.js-core/tesseract-core-simd.{js,wasm}"

asar: true
# The native modules are prebuilt N-API binaries for each platform; nothing to compile.
npmRebuild: false
# Native modules and packages that start their own workers or read wasm from
# disk must sit outside the archive.
asarUnpack:
  - "**/node_modules/@napi-rs/**"
  - "**/node_modules/@seydx/**"
  - "**/node_modules/tesseract.js/**"
  - "**/node_modules/tesseract.js-core/**"
  - "**/node_modules/@tesseract.js-data/**"

# Packaged builds only: the binary can't be turned into a plain Node, takes no
# Node options or inspector flags from outside, and runs only the app in its
# (integrity-checked) asar. The core runs as a utility process, so it needs none of these.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true

mac:
  category: public.app-category.productivity
  # Icon Composer bundle for macOS 26 and later (compiled by actool, so the
  # build needs Xcode 26+); build/icon.icns is the DMG's volume icon. Every icon
  # comes from build/brand/mark.png via scripts/brand/build-icons.py.
  icon: icon.icon
  hardenedRuntime: true
  # The defaults plus Apple Events, which Mail & connectors use (src/server/mail).
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: Phaethon uses the Mail app (or Outlook) to read and send email from the accounts you added there, only for the spaces you choose.
  # zip is what the updater installs on macOS; dmg is for people.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  target:
    - target: nsis
      arch: [x64]

dmg:
  icon: icon.icns

nsis:
  oneClick: true
  perMachine: false

linux:
  executableName: phaethon
  category: Education
  synopsis: An accessible, desktop-first AI agent workspace.
  maintainer: Jeryn Vicari
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

deb:
  # LaTeX documents compile inside bubblewrap on Linux.
  recommends:
    - bubblewrap

publish:
  provider: github
  owner: jerynv
  repo: phaethon
  releaseType: draft
