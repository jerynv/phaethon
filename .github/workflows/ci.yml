name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Playwright 1.60 has no browser build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # The LaTeX sandbox tests use bubblewrap on Linux; they skip themselves if it can't run here.
      - name: Sandbox for the LaTeX tests
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # End-to-end: the built UI against the real core with a scripted model.
      - name: Browser for the UI tests
        run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
